# The pick-obs-trends cron (trends radar plan TR-15, D6; design 3.1, 6.3). Railway no longer reads a service's
# railway.toml (config as code is retired; a config path is refused): scripts/pick-railway-settings.py writes this file
# into the service's settings and checks them against it. Runbook: docs/pick-workbench/observe-runbook/packaging.md
# section 3. Pinned field by field by customizations/pick-workbench/tests/observe/test_railway_config.py.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.pick-gateway"

[deploy]
# Railway runs the start command without a shell, so the cd needs one; exec leaves python as the process.
startCommand = '/bin/sh -c "cd /app/backend && exec python -m ggwork_pick.observe.trends run"'
# A failed trigger is not rerun at once: the next trigger, 30 minutes later, resumes from the database.
restartPolicyType = "NEVER"
# UTC. 17:00 does nothing (before every mode's start: stable 17:30, canary2 18:30, canary1 21:00; a trigger before its
# mode's start exits 0); a session runs to the 01:45 hard deadline, and while it runs Railway skips the triggers that
# fall inside it. No healthcheckPath: nothing listens.
cronSchedule = "*/30 17-23,0-1 * * *"
