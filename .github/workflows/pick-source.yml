name: Native pick source
on:
  pull_request:
    paths:
      - 'customizations/pick-source/**'
      - '.github/workflows/pick-source.yml'
  push:
    branches: [main]
    paths:
      - 'customizations/pick-source/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: pick_source_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: customizations/pick-source
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
        env:
          PICK_SOURCE_TEST_DATABASE_URL: postgresql://fixture:fixture@localhost:5432/pick_source_test
