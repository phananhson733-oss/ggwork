[project]
name = "ggwork-pick"
version = "0.3.0"
description = "Personal drama selection workspace for DeerFlow"
requires-python = ">=3.12"
dependencies = [
  "deerflow-extension-api==0.2.1",
  "deerflow-harness==2.1.0",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.31",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.14,<2",
  "pydantic>=2,<3",
  "langchain>=1.3,<2",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.13,<3",
  "cryptography>=50",
]

[project.entry-points."deerflow.extensions"]
ggwork-pick = "ggwork_pick:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ggwork_pick"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
