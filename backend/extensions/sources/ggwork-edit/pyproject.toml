[project]
name = "ggwork-edit"
version = "0.1.0"
description = "Owner-scoped native editing tasks for DeerFlow"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api==0.2.1", "pydantic>=2,<3", "httpx>=0.28,<1"]

[project.scripts]
ggwork-edit-worker = "ggwork_edit.worker.cli:main"

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.14,<2",
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
]

[project.entry-points."deerflow.extensions"]
ggwork-edit = "ggwork_edit:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ggwork_edit"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
