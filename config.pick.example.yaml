# Personal pick workbench. Copy to config.yaml; never put credentials here.
# The model's effort, output cap and timeouts are $PICK_LLM_* variables, and the Gateway also reads
# PICK_RUN_TIMEOUT_SECONDS. pick_entrypoint and pick Compose fill the defaults (thinking on high, off low,
# 32000 output tokens, 300 s request and chunk timeouts, 600 s per turn); set a variable on Railway to change
# one without a rebuild. A native Gateway started from a copy of this file must export them itself.
config_version: 46
models:
  - name: azure-pick
    display_name: Azure LLM
    use: langchain_openai:ChatOpenAI
    model: $AZURE_OPENAI_DEPLOYMENT
    base_url: $AZURE_OPENAI_BASE_URL
    api_key: $AZURE_OPENAI_API_KEY
    default_headers:
      api-key: $AZURE_OPENAI_API_KEY
    use_responses_api: true
    output_version: responses/v1
    use_previous_response_id: false
    store: false
    include: [reasoning.encrypted_content]
    reasoning: {effort: $PICK_LLM_EFFORT_THINKING_OFF}
    model_kwargs: {parallel_tool_calls: false}
    # Seconds; while streaming also the longest silence between two bytes, which covers reasoning.
    request_timeout: $PICK_LLM_REQUEST_TIMEOUT_SECONDS
    stream_chunk_timeout: $PICK_LLM_STREAM_CHUNK_TIMEOUT_SECONDS
    max_retries: 0
    # Sent as max_output_tokens under the Responses API; reasoning tokens count against it.
    max_tokens: $PICK_LLM_MAX_OUTPUT_TOKENS
    supports_thinking: true
    when_thinking_enabled:
      reasoning: {effort: $PICK_LLM_EFFORT_THINKING_ON}
    when_thinking_disabled:
      reasoning: {effort: $PICK_LLM_EFFORT_THINKING_OFF}
    supports_vision: false

database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
  checkpoint_channel_mode: full
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
tools:
  - {name: clip_submit, group: editing, use: 'ggwork_edit.tools:submit_tool'}
  - {name: clip_get, group: editing, use: 'ggwork_edit.tools:get_tool'}
  - {name: clip_stop, group: editing, use: 'ggwork_edit.tools:stop_tool'}
  - {name: clip_prepare, group: editing, use: 'ggwork_edit.tools:prepare_tool'}
  - {name: clip_retry, group: editing, use: 'ggwork_edit.tools:retry_tool'}
  - {name: clip_confirm_plan, group: editing, use: 'ggwork_edit.tools:confirm_tool'}
  - {name: clip_change_version, group: editing, use: 'ggwork_edit.tools:change_version_tool'}
  - {name: pick_search_knowledge, group: pick, use: 'ggwork_pick.tools:search_knowledge_tool'}
  - {name: pick_query_candidates, group: pick, use: 'ggwork_pick.tools:query_candidates_tool'}
  - {name: pick_query_data, group: pick, use: 'ggwork_pick.tools:query_data_tool'}
  - {name: pick_count_candidates, group: pick, use: 'ggwork_pick.tools:count_candidates_tool'}
  - {name: pick_get_drama_detail, group: pick, use: 'ggwork_pick.tools:get_drama_detail_tool'}
  - {name: pick_prepare_selection, group: pick, use: 'ggwork_pick.tools:prepare_selection_tool'}
  - {name: pick_get_feedback, group: pick, use: 'ggwork_pick.feedback.tools:get_feedback_tool'}
  - {name: pick_analyze_feedback, group: pick, use: 'ggwork_pick.feedback.tools:analyze_feedback_tool'}
  # Keyless public web tools, shown as enabled in the capability center; PickToolGate budgets them as plugins.
  - {name: web_search, group: web, use: 'deerflow.community.ddg_search.tools:web_search_tool', max_results: 5}
  - {name: web_fetch, group: web, use: 'deerflow.community.jina_ai.tools:web_fetch_tool', timeout: 10}
  # Read-only Feishu commands under each user's own authorization (docs/pick-workbench/lark-personal-auth.md).
  # PickModelGate offers it only to a user who connected Feishu in the capability center; PickToolGate budgets it apart.
  - {name: lark_cli, group: lark, use: 'ggwork_pick.lark_tool:lark_cli_tool'}
tool_groups:
  - {name: editing}
  - {name: pick}
  - {name: web}
  - {name: lark}
tool_output:
  # The host budget replaces any tool result over 12,000 characters with a prose summary (30,000 truncates
  # regardless), which a candidate result reaches at 8 to 10 dramas: the card then fails to parse it and the
  # model is pointed at read_file, which PickToolGate refuses. Pick results stay whole; the read_file pair is
  # the host default and stays exempt too. pick_query_data has its own closed20-row/48KB projection.
  exempt_tools: [read_file, read_file_tool, pick_query_candidates, pick_query_data, pick_count_candidates, pick_get_drama_detail, pick_prepare_selection, pick_search_knowledge, pick_get_feedback, pick_analyze_feedback]
plugins:
  - name: ggwork-edit
    use: ggwork_edit:install
    required: true
    enabled: true
    table_prefix: ggwe_
    config: {planner_model: azure-pick}
  - name: ggwork-pick
    use: 'ggwork_pick:install'
    required: true
    enabled: true
    table_prefix: ggwp_
    config: {}
recursion_limit: 1000
max_recursion_limit: 1000
memory:
  enabled: false
  injection_enabled: false
suggestions:
  enabled: false
title:
  enabled: true
  model_name: null
summarization:
  enabled: false
task_continuity:
  enabled: false
skill_evolution:
  enabled: false
scheduler:
  enabled: false
auth:
  local:
    allow_registration: false
authorization:
  enabled: true
  fail_closed: true
  default_role: user
  provider:
    use: deerflow.authz.rbac:RbacAuthorizationProvider
    config:
      roles:
        admin:
          # MCP tool names come from the servers an admin enables in the capability center, so they cannot be
          # listed here; the pick middleware admits pick tools, web_search/web_fetch, lark_cli and enabled MCP tools only.
          tools:
            allow: '*'
            deny: [present_files, review_skill_package, list_uploaded_files, task, task_status, batch_task, batch_status, cancel_batch, list_background_tasks, cancel_background_task, invoke_acp_agent]
          routes: {allow: '*'}
          models: {allow: [azure-pick]}
          sandbox: {allow: false}
          skills: {allow: [pick-drama, clip-highlight, clip-hook]}
        user:
          # MCP tool names come from the servers an admin enables in the capability center, so they cannot be
          # listed here; the pick middleware admits pick tools, web_search/web_fetch, lark_cli and enabled MCP tools only.
          tools:
            allow: '*'
            deny: [present_files, review_skill_package, list_uploaded_files, task, task_status, batch_task, batch_status, cancel_batch, list_background_tasks, cancel_background_task, invoke_acp_agent]
          routes: {allow: '*'}
          models: {allow: [azure-pick]}
          sandbox: {allow: false}
          skills: {allow: [pick-drama, clip-highlight, clip-hook]}

extensions:
  middlewares:
    - ggwork_pick.middleware:PickModelGate
    - ggwork_pick.middleware:PickToolGate
